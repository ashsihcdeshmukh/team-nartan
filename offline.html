<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Edge - Offline</title>
<meta name="theme-color" content="#c8972a">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0b14;color:#f0eee8;font-family:Arial,sans-serif;padding:24px;text-align:center}
  .box{max-width:360px}
  h1{font-size:24px;margin:0 0 10px;color:#c8972a}
  p{font-size:15px;line-height:1.5;color:#b8b0c8;margin:0 0 18px}
  button{background:#c8972a;color:#15100a;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <h1>Creative Edge</h1>
    <p>You are offline right now. Please connect to the internet to login, pay fees, or update studio data.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
